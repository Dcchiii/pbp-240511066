<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app">
        <h1>📝 To-Do List</h1>

        </form>
        <p id="stats">0 tugas belum selesai</p>
        <ul id="list-todo"></ul>
    </div>
    <script src="apps.js"></script>
</body>

</html>
